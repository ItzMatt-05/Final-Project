<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HelpHub - Charity Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>HelpHub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="charities.html">Charities</a>
      <a href="charity_profile.html">Charity Profile</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Wells for Life - Clean Water Initiative</h2>
      <img id="charityImg" src="https://t3.ftcdn.net/jpg/03/10/40/70/240_F_310407095_lFjpixbZStsIzniox3VmSXSXkfVdZUVA.jpg" alt="Charity Image">
      <p id="extraInfo" style="display: none;">Wells for Life is dedicated to building clean water systems in underserved communities to ensure clean water is readily available to as many people as possible.</p>
    </section>

    <section>
      <h3>Contact / Donate</h3>
      <button id="volunteerBtn">Volunteer Now</button>
      
      <div id="volunteerForm" style="display: none;">
      <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="message">Message or Donation Note:</label><br>
        <textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>

        <input type="submit" value="Send">
      </form>
     </div>
   </section>
 </main>

  <footer>
    <p>© 2025 HelpHub</p>
  </footer>

  <script src="charity_profile.js"></script>
  </body>
  </html>
